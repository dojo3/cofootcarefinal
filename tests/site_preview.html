<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive site verification</title><style>body{margin:0;padding:20px;background:#ddd;font:14px system-ui}h1{font-size:18px;margin:0 0 12px}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}label{display:flex;gap:8px;align-items:center}select{padding:10px;font:inherit}iframe{display:block;border:1px solid #aaa;background:white;height:850px;max-width:none;margin-inline:auto}.preview{overflow:auto;padding:5px 0 20px}</style></head><body><h1>Responsive site verification</h1><div class="controls"><label>Page<select id="page"><option value="index.html">Home</option><option value="services.html">Services</option><option value="service-areas.html">Service areas</option><option value="about.html">About</option><option value="contact.html">Contact</option><option value="articles.html">Article collection</option><option value="articles/footnotes-bunions.html">Article reader</option></select></label><label>Viewport width<select id="width"><option value="390">390 px — phone</option><option value="320">320 px — small phone</option><option value="768">768 px — tablet</option><option value="1280">1280 px — desktop</option></select></label></div><div class="preview"><iframe title="Site preview" id="preview" src="../index.html" width="390" height="850"></iframe></div><script>const frame=document.getElementById('preview');document.getElementById('page').addEventListener('change',e=>frame.src='../'+e.target.value);document.getElementById('width').addEventListener('change',e=>frame.style.width=e.target.value+'px');</script></body></html>
